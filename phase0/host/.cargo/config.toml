# The wasm shell sets CC/CXX to the WASI SDK clang, which cannot compile
# native C dependencies (zstd-sys, etc.) that wasmtime pulls in.
# Override to the Nix-provided native gcc so cargo build works without
# needing manual CC= prefixes on every invocation.
[env]
CC = { value = "gcc", force = true }
CXX = { value = "g++", force = true }

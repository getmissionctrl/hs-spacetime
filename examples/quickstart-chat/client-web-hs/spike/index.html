<!doctype html>
<meta charset="utf-8" />
<title>JSFFI spike</title>
<pre id="log"></pre>
<script type="module">
  import { WASI, OpenFile, File, ConsoleStdout }
    from "https://cdn.jsdelivr.net/npm/@bjorn3/browser_wasi_shim@0.3.0/+esm";
  import ghc_wasm_jsffi from "./ghc_wasm_jsffi.js";

  const fds = [
    new OpenFile(new File([])),
    ConsoleStdout.lineBuffered((m) => console.log("[wasm]", m)),
    ConsoleStdout.lineBuffered((m) => console.error("[wasm]", m)),
  ];
  const wasi = new WASI([], [], fds);
  const bytes = await (await fetch("./spike.wasm")).arrayBuffer();
  const mod = await WebAssembly.compile(bytes);

  // Knot-tying per ghc_wasm_jsffi.js / post-link.mjs: the generated glue is
  // `export default (__exports) => { ...returns the import object... }`. It
  // references __exports.memory / __exports.rts_* directly, so we hand it an
  // initially-empty object, instantiate, then assign the instance's exports
  // back INTO that same object.
  const __exports = {};
  const inst = await WebAssembly.instantiate(mod, {
    wasi_snapshot_preview1: wasi.wasiImport,
    ghc_wasm_jsffi: ghc_wasm_jsffi(__exports),
  });
  Object.assign(__exports, inst.exports);

  wasi.initialize(inst);
  inst.exports._initialize?.();
  inst.exports.startSpike("wss://ws.postman-echo.com/raw");
</script>

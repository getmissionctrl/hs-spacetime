<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JSFFI spike</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; }
  pre { border: 1px solid #888; padding: .5rem; white-space: pre-wrap;
        word-break: break-word; font-family: monospace; min-height: 3rem; }
  h2 { margin: 1rem 0 .25rem; font-size: 1rem; }
  .err { color: #b00; }
  .ok { color: #070; }
</style>
</head>
<body>
<h1>JSFFI spike</h1>

<h2>Haskell output (js_log writes here — #log)</h2>
<pre id="log">(empty)</pre>

<h2>loader steps</h2>
<pre id="jslog"></pre>

<script>
  // #log belongs to Haskell (its js_log does #log.innerText += ...).
  // We seed it once, then never touch it from JS except to READ it.
  document.getElementById("log").innerText = "";
  var jl = document.getElementById("jslog");
  function log(msg, cls) {
    var line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = msg;
    jl.appendChild(line);
  }
  window.log = log;
  log("page script running");
  window.addEventListener("error", (e) => log("window error: " + (e.message || e.error || e), "err"));
  window.addEventListener("unhandledrejection", (e) =>
    log("unhandled rejection: " + (e.reason && (e.reason.stack || e.reason.message || e.reason)), "err"));

  // Periodically mirror the raw content of #log into the loader pane so we can
  // SEE what Haskell wrote even if rendering is odd.
  function dumpHaskell(tag) {
    var raw = document.getElementById("log").innerText;
    log(tag + " #log contains: " + JSON.stringify(raw));
  }
  window.dumpHaskell = dumpHaskell;
</script>
<script type="module">
  async function main() {
    try {
      log("importing browser_wasi_shim (CDN)…");
      const { WASI, OpenFile, File, ConsoleStdout } =
        await import("https://cdn.jsdelivr.net/npm/@bjorn3/browser_wasi_shim@0.3.0/+esm");
      const cb = "?cb=" + Date.now(); // defeat mobile caching of wasm/glue
      log("importing ghc_wasm_jsffi.js…");
      const { default: ghc_wasm_jsffi } = await import("./ghc_wasm_jsffi.js" + cb);

      const fds = [
        new OpenFile(new File([])),
        ConsoleStdout.lineBuffered((m) => log("[wasm] " + m)),
        ConsoleStdout.lineBuffered((m) => log("[wasm err] " + m, "err")),
      ];
      const wasi = new WASI([], [], fds);

      log("fetching spike.wasm…");
      const bytes = await (await fetch("./spike.wasm" + cb)).arrayBuffer();
      log("compiling wasm (" + bytes.byteLength + " bytes)…");
      const mod = await WebAssembly.compile(bytes);

      log("instantiating…");
      const __exports = {};
      const inst = await WebAssembly.instantiate(mod, {
        wasi_snapshot_preview1: wasi.wasiImport,
        ghc_wasm_jsffi: ghc_wasm_jsffi(__exports),
      });
      Object.assign(__exports, inst.exports);

      log("initializing RTS (wasi.initialize)…");
      wasi.initialize(inst);
      log("RTS initialized", "ok");

      log("calling startSpike…", "ok");
      const r = inst.exports.startSpike("wss://ws.postman-echo.com/raw");
      log("startSpike returned a " + (r && typeof r.then === "function" ? "Promise (async export)" : typeof r));
      if (r && typeof r.then === "function") {
        r.then(() => { log("startSpike promise resolved", "ok"); dumpHaskell("after-resolve"); })
         .catch((e) => log("startSpike promise rejected: " + e, "err"));
      }
      setTimeout(() => dumpHaskell("after-2s"), 2000);
      setTimeout(() => dumpHaskell("after-6s"), 6000);
    } catch (e) {
      log("EXCEPTION: " + (e && (e.stack || e.message || e)), "err");
    }
  }
  main();
</script>
</body>
</html>
